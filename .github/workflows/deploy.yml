name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: attendance-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: attendance-app

      - name: Build
        run: npm run build:gh-pages
        working-directory: attendance-app

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: attendance-app/dist/attendance-app/browser
          branch: gh-pages
          clean: true
