<mat-toolbar color="primary">
  <span>Browse Members</span>
  <span class="spacer"></span>
  <a mat-button routerLink="/">Back to Attendance</a>
</mat-toolbar>

<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Member Directory ({{ filteredMembers.length }})</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <!-- Filters and Controls -->
      <div class="filters">
        <div>
          <h3>Filter by Club:</h3>
          <mat-checkbox [(ngModel)]="showAARC" (change)="applyFilters()">AARC</mat-checkbox>
          <mat-checkbox [(ngModel)]="showBARC" (change)="applyFilters()">BARC</mat-checkbox>
        </div>
        <div class="photo-toggle">
          <mat-slide-toggle [(ngModel)]="showPhotosEnabled" (change)="updateDisplayedColumns()">
            Show photos
          </mat-slide-toggle>
        </div>
      </div>

      <!-- Member Table -->
      <table mat-table [dataSource]="filteredMembers" matSort (matSortChange)="onSortChange($event)" class="member-table">
        <!-- Photo Column -->
        <ng-container matColumnDef="photo">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Photo</th>
          <td mat-cell *matCellDef="let member">
            <img *ngIf="hasPhoto(member.callsign)"
                 [src]="getPhotoUrl(member.callsign)"
                 [alt]="member.callsign + ' photo'"
                 class="member-photo">
          </td>
        </ng-container>

        <!-- Callsign Column -->
        <ng-container matColumnDef="callsign">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Callsign</th>
          <td mat-cell *matCellDef="let member">
            <a [href]="'https://www.qrz.com/db/' + member.callsign" target="_blank" class="callsign-link">{{ member.callsign }}</a>
          </td>
        </ng-container>

        <!-- First Name Column -->
        <ng-container matColumnDef="firstName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>First Name</th>
          <td mat-cell *matCellDef="let member">{{ getFirstName(member) }}</td>
        </ng-container>

        <!-- Last Name Column -->
        <ng-container matColumnDef="lastName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Last Name</th>
          <td mat-cell *matCellDef="let member">{{ getLastName(member) }}</td>
        </ng-container>

        <!-- Clubs Column -->
        <ng-container matColumnDef="clubs">
          <th mat-header-cell *matHeaderCellDef>Clubs</th>
          <td mat-cell *matCellDef="let member">
            <mat-chip-set>
              <mat-chip *ngFor="let club of member.clubs">{{ club }}</mat-chip>
            </mat-chip-set>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <div class="member-count">
        Total Members: {{ filteredMembers.length }}
      </div>
    </mat-card-content>
  </mat-card>
</div>
